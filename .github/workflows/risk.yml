name: Risk tier

# Sets the PR's risk tier from the files it touches (scripts/risk-tier.mjs) and writes it to the job summary.
# High-risk PRs fail until the PR description has a ticked line written by a human that names the head commit:
#   - [x] Human read the High-risk diff at <sha>
# Any new push changes the head SHA and voids the sign-off. Editing the description re-runs only this job.
# Make "Risk tier / risk" a required status check in branch protection for main.
#
# Trust: `pull_request_target` runs THIS file and the classifier as they are on the base branch, so a PR can't
# edit the gate it is judged by (with `pull_request`, GitHub runs the PR's own copy of the workflow). The PR head
# is fetched only as git objects to diff against; none of its code is checked out or run. Keep it that way:
# no `ref:` to the PR head in checkout, no install/build, no secrets, read-only token.
# Consequence: a change to this file or to risk-tier.mjs takes effect after it merges, not on its own PR.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: risk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  risk:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Base branch (the default for pull_request_target) — never the PR head.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Classify and check sign-off
        env:
          # Passed through env, never interpolated into the script: the body is untrusted text.
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin "+refs/pull/$PR_NUMBER/head:refs/remotes/pr/head"
          test "$(git rev-parse refs/remotes/pr/head)" = "$HEAD_SHA"
          status=0
          node scripts/risk-tier.mjs --base "origin/$BASE_REF" --head refs/remotes/pr/head --check-signoff > risk.txt 2>&1 || status=$?
          cat risk.txt
          { echo '```'; cat risk.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
