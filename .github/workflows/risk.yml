name: Risk tier

# Sets the PR's risk tier from the files it touches (scripts/risk-tier.mjs) and writes it to the job summary.
# High-risk PRs fail until the owner (admin/maintain) adds the label "risk: human-read" after reading the diff. Only
# the run triggered by adding it passes, and only while the PR head is the commit it was added on: any later event (a
# push, reopen, another label) re-runs this job and fails it — remove and re-add the label to sign off again. The PR
# description is not read at all. Create the label once per repo; make "Risk tier / risk" a required status check.
#
# Trust: `pull_request_target` runs THIS file and the classifier as they are on the base branch, so a PR can't
# edit the gate it is judged by (with `pull_request`, GitHub runs the PR's own copy of the workflow). The PR head
# is fetched only as git objects to diff against; none of its code is checked out or run. Keep it that way:
# no `ref:` to the PR head in checkout, no install/build, no secrets, read-only token (it must stay read-only).
# Consequence: a change to this file or to risk-tier.mjs takes effect after it merges, not on its own PR.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: risk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  risk:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Base branch (the default for pull_request_target) — never the PR head.
          fetch-depth: 0
          # Credentials stay configured: the PR-head fetch below needs them in private repos. The token is
          # read-only (`permissions: contents: read`) and no PR code runs in this job, so nothing can use it.

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Classify and check sign-off
        env:
          # The script reads the event (label, sender, head) from GITHUB_EVENT_PATH and asks the API for the current
          # head and the sender's role.
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin "+refs/pull/$PR_NUMBER/head:refs/remotes/pr/head"
          test "$(git rev-parse refs/remotes/pr/head)" = "$HEAD_SHA"
          status=0
          node scripts/risk-tier.mjs --base "origin/$BASE_REF" --head refs/remotes/pr/head --check-signoff > risk.txt 2>&1 || status=$?
          cat risk.txt
          { echo '```'; cat risk.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
