version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    # One weekly PR for every minor/patch update (fewer PRs for a solo maintainer). Groups only
    # take minor/patch, so each major (next, react, typescript, payload …) is its own PR.
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # @types/node follows the Node runtime (24.x, `engines` + `.nvmrc`), not npm's latest major.
      # Bump it by hand together with the runtime.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
